context_budget:
  response_headroom_pct: 20
  splits:
    history: 0.4
    memory: 0.25
    graph: 0.15
    screen: 0.1
    system: 0.1
  max_attached_file_tokens: 4000
cost:
  budget_usd: 10.0
  warn_pct: 80
  block_pct: 100
memory:
  sqlite_path: ~/.makima/conversations.db
  flush_interval_s: 3
  search_k: 10
  entity_extraction:
    min_confidence: 0.7
    thread_timeout_s: 60
  dedup:
    cosine_threshold: 0.92
    short_text_threshold: 0.89
  forget:
    cascade_confirm: true
native_services:
  embed:
    grpc_addr: 127.0.0.1:50053
    binary: native/embed/build/embed_service
    health_timeout_s: 2
  screen:
    grpc_addr: 127.0.0.1:50054
    binary: native/screen/build/screen_service
    health_timeout_s: 2
  notify:
    grpc_addr: 127.0.0.1:50055
    binary: native/notify/build/notify_service
    health_timeout_s: 2
  clipboard:
    grpc_addr: 127.0.0.1:50056
    binary: native/clipboard/build/clipboard_service
    health_timeout_s: 2
watchdog:
  interval_s: 5
  max_restarts: 5
  backoff_base_s: 2
  backoff_max_s: 60
  stagger_restart_gap_s: 2
ghost_watchdog:
  enabled: true
  cron_interval_s: 300
  alert_cooldown_s: 300
  cron_endpoints:
  - name: Brain Health
    url: http://127.0.0.1:8080/health
    method: GET
    timeout_s: 10
    expected_status: 200
    alert_on_failure: true
  webhook:
    enabled: true
    secret: ''
    max_payload_size: 65536
disk:
  monitor_path: ~/.makima/
  poll_interval_s: 60
  warn_pct: 80
  critical_pct: 90
  emergency_pct: 95
  recovery_pct: 88
  hnsw_growth_warn_mb_day: 10
checkpoint:
  interval_s: 15
  path: ~/.makima/checkpoint.cbor
voice:
  wake_word_enabled: true
  hotword_engine: openwakeword
  hotword_word: hey makima
  hotword_threshold: 0.5
  hotword_model_path: ~/.makima/hotword/
  ptt_key: ctrl+shift+space
  ptt_min_hold_ms: 300
  ptt_max_hold_s: 30
  voice_engine: gemini_live
  gemini_live:
    model: gemini-2.5-flash-native-audio-latest
    voice_name: Aoede
  diarization:
    enabled: false
    enrollment_path: ~/.makima/voice_enroll.npy
screen:
  frame_delta_threshold_pct: 2.0
  max_width: 1280
  max_height: 720
  vision_backend: gemini
  ocr_fallback: true
clipboard:
  enabled: true
  max_chars: 4000
  ws_events: false
notifications:
  outbound: true
  inbound: false
messaging:
  telegram_bot_token: ''
  discord_bot_token: ''
  email:
    smtp_host: smtp.gmail.com
    smtp_port: 587
    imap_host: imap.gmail.com
    username: ''
    password: ''
  whatsapp:
    enabled: true
calendar:
  backend: none
  google_token_path: ~/.makima/gcal_token.json
  outlook_token_path: ~/.makima/outlook_token.json
  ics_path: ''
ollama:
  require: false
  host: http://127.0.0.1:11434
  default_model: llama3.2
  max_restart_attempts: 3
privacy:
  mode: false
agents:
  models:
    system_agent: auto
    browser_agent: auto
    code_agent: auto
    research_agent: auto
    media_agent: auto
    document_agent: auto
    data_analyst_agent: auto
    messaging_agent: auto
    automation_agent: auto
    security_agent: auto
    devops_agent: auto
    creative_agent: auto
    voice_agent: auto
    memory_agent: auto
  background_limits:
    max_wall_time_s: 300
    max_tokens: 50000
    max_tool_calls: 20
  interactive_limits:
    max_wall_time_s: 600
    max_tokens: 100000
    max_tool_calls: 50
  commander:
    max_subtasks_warn: 10
    max_call_depth: 3
offline_queue:
  max_messages: 50
  stale_screen_context_s: 30
export:
  backup_path: ~/Documents/makima_backups/
  encrypt: false
proactive:
  fullscreen_check: true
  idle_min_s: 30
  max_queued: 5
media:
  connectors:
    youtube:
      type: native_browser_app
      handler: _play_youtube
      domain_markers:
      - youtube.com
      - youtu.be
      aliases:
      - youtube
      - yt
      - youtube pe
      - yt pe
      - youtube par
      is_default: true
    spotify:
      type: native_browser_app
      handler: _play_spotify
      domain_markers:
      - spotify.com
      aliases:
      - spotify
      - spotify pe
      - spotify par
server:
  rest_port: 8080
  ws_port: 8765
  host: 127.0.0.1
mcp_servers: []
