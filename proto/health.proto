syntax = "proto3";

package makima.health;

// Universal health check service — every native service MUST implement this.
// WatchdogManager polls Health.Check() every 5s (RULE 1 from gRPC contract).

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;  // optional: name of the service being checked
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string version = 2;           // service version string
  int64 uptime_seconds = 3;     // seconds since service started
  map<string, string> metadata = 4;  // optional key-value metadata
}
