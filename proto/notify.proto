syntax = "proto3";

package makima.notify;

import "health.proto";

// Windows notification service (C++).
// Outbound: send Windows toast notifications via IToastNotificationManager.
// Inbound: read notification center via IUserNotificationController (Win10+).
// Both disabled in Privacy Mode (N7 handles OS permission rejection).

service NotifyService {
  // Send a Windows toast notification
  rpc SendToast(ToastRequest) returns (ToastResponse);
  
  // Read recent notifications from Windows notification center
  rpc ReadNotifications(ReadNotificationsRequest) returns (ReadNotificationsResponse);
  
  // Health check (required by WatchdogManager)
  rpc HealthCheck(makima.health.HealthCheckRequest) returns (makima.health.HealthCheckResponse);
}

message ToastRequest {
  string title = 1;
  string body = 2;
  string image_path = 3;       // optional: path to image for toast
  repeated string actions = 4; // button labels (max 3)
  int32 expiration_s = 5;      // toast auto-dismiss time (default 10s)
}

message ToastResponse {
  bool success = 1;
  string error = 2;
  string notification_id = 3;  // for tracking clicks
}

message ReadNotificationsRequest {
  int32 max_count = 1;         // max notifications to return (default 20)
  int64 since_timestamp = 2;   // only notifications after this Unix timestamp
  repeated string app_filter = 3; // filter by app name (empty = all)
}

message ReadNotificationsResponse {
  repeated Notification notifications = 1;
}

message Notification {
  string app_name = 1;
  string title = 2;
  string body = 3;
  int64 timestamp = 4;
  string notification_id = 5;
}
