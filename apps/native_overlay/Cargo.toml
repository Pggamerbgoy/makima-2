[package]
name = "makima-native-overlay"
version = "0.1.0"
edition = "2021"
description = "Makima's lightweight native Windows quick-command overlay"
license = "MIT"

[dependencies]
futures-util = "0.3.31"
global-hotkey = "0.8.0"
open = "5.3.2"
raw-window-handle = "0.6.2"
serde_json = "1.0.145"
slint = { version = "1.17.1", features = ["raw-window-handle-06"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
] }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
