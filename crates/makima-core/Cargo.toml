[package]
name = "makima-core"
version = "0.1.0"
edition = "2021"
description = "Makima v7.1 — Rust core: HNSW, TripleStore, Checkpointing with PyO3 bindings"

[lib]
name = "makima_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
parking_lot = "0.12"
ordered-float = "4"

[profile.release]
opt-level = 3
lto = true
