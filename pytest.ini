[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

markers =
    unit: Isolated fast unit tests (< 5s)
    integration: Cross-component dispatch and recovery (< 15s)
    smoke: Rapid boot and configuration verification (< 2s)
    regression: AST scans and architectural contract integrity guards
    llm_eval: Benchmark suites for Groq reasoning accuracy
    e2e: End-to-end tests requiring live Windows desktop/browser

addopts = 
    -v
    -s
    --strict-markers
    --tb=short

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
