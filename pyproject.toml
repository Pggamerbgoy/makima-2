[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "makima-brain"
version = "0.1.0"
description = "Makima Windows desktop assistant brain and inter-process contracts"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
    "authlib>=1.3.1,<2.0",
    "cryptography>=45.0.1",
    "keyring>=25.4.0,<26.0",
]

[dependency-groups]
dev = [
    "grpcio>=1.76,<2.0",
    "grpcio-tools>=1.76,<2.0",
    "maturin>=1.8,<2.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
