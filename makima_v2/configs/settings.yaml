# ==============================================================================
# Makima v2 — Dynamic System Configuration
# ==============================================================================

app:
  name: "Makima"
  version: "2.0.0"
  env: "development"
  data_dir: "~/.makima"
  log_level: "INFO"

# ------------------------------------------------------------------------------
# 1. Model Providers & Zero-Cost Pareto Routing
# ------------------------------------------------------------------------------
providers:
  default: "auto" # "auto" uses ParetoRouter to pick optimal active model
  circuit_breaker:
    max_failures: 3
    cooldown_seconds: 30
    jitter: true

  # Task Cascades: Free tiers prioritized
  cascades:
    fast_chat: ["groq", "gemini", "openrouter_free", "ollama"]
    code: ["ollama", "groq", "openrouter_free", "gemini"]
    deep_reasoning: ["gemini", "openrouter_free", "ollama"]
    vision: ["gemini"]
    voice: ["gemini_live"]
    offline: ["ollama"]

  backends:
    gemini:
      adapter: "gemini"
      model: "gemini-2.5-flash"
      api_key_env: "GEMINI_API_KEY"
      latency_tier: "fast"
      context_limit: 1000000

    groq:
      adapter: "openai"
      base_url: "https://api.groq.com/openai/v1"
      model: "llama-3.3-70b-versatile"
      api_key_env: "GROQ_API_KEY"
      latency_tier: "fast"
      context_limit: 128000

    ollama:
      adapter: "ollama"
      base_url: "http://localhost:11434"
      model: "qwen2.5-coder:7b"
      latency_tier: "standard"
      context_limit: 32768

    openrouter_free:
      adapter: "openai"
      base_url: "https://openrouter.ai/api/v1"
      model: "meta-llama/llama-3.3-70b-instruct:free"
      api_key_env: "OPENROUTER_API_KEY"
      latency_tier: "standard"
      context_limit: 64000

# ------------------------------------------------------------------------------
# 2. Multi-Platform Messaging Gateway Daemon
# ------------------------------------------------------------------------------
gateway:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  security:
    allow_all_users: false # When false, only allowlisted users can command agent
    allowlist_user_ids: []
    pairing_code_enabled: true

  platforms:
    telegram:
      enabled: false
      token_env: "TELEGRAM_BOT_TOKEN"
      require_mention_in_groups: true

    discord:
      enabled: false
      token_env: "DISCORD_BOT_TOKEN"
      voice_enabled: true

    whatsapp:
      enabled: false
      session_dir: "~/.makima/whatsapp_session"

# ------------------------------------------------------------------------------
# 3. Memory & Self-Improving Skills
# ------------------------------------------------------------------------------
memory:
  state_dir: "~/.makima/state"
  sqlite_path: "~/.makima/state/history.db"
  fts_enabled: true
  vector_search:
    enabled: true
    embedding_model: "BAAI/bge-small-en-v1.5"

skills:
  directory: "~/.makima/skills"
  auto_synthesize: true

# ------------------------------------------------------------------------------
# 4. OS & Tool Sandbox
# ------------------------------------------------------------------------------
tools:
  sandbox:
    mode: "local_clamped" # "local_clamped" or "docker"
    workspace_dir: "~/.makima/workspace"
    command_timeout_seconds: 45
    block_dangerous_commands: true

  browser:
    headless: false # False allows visible browser window on user desktop
    stealth: true
    cdp_endpoint: "http://localhost:9222"

# ------------------------------------------------------------------------------
# 5. Multimodal Voice
# ------------------------------------------------------------------------------
voice:
  tts_engine: "edge_tts" # "edge_tts" or "gemini_live" or "kokoro"
  edge_tts_voice: "en-US-AvaNeural"
  hindi_voice: "hi-IN-SwaraNeural"
  sounddevice:
    sample_rate: 24000
    channels: 1
