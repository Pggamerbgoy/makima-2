[project]
name = "makima"
version = "2.0.0"
description = "Autonomous Multi-Platform AI Desktop Assistant with Hermes Architecture & Zero-Cost Pareto Routing"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Core Server & Async Runtime
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx[http2]>=0.28.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "pathspec>=1.1.1",
    
    # Windows Stability & Native OS
    "psutil>=7.0.0",
    "tzdata>=2025.3; sys_platform == 'win32'",
    "concurrent-log-handler>=0.9.29; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "pywinpty>=2.0.14; sys_platform == 'win32'",
    "pyautogui>=0.9.54",

    # Model Providers & Routing (Free-Tier & Zero-Cost First)
    "google-genai>=2.22.0",
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "ollama>=0.4.0",
    "tiktoken>=0.8.0",

    # Dual-Tier Memory & Embeddings
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.3",
    "fastembed>=0.4.0",

    # Multi-Platform Messaging Gateway
    "python-telegram-bot[webhooks]>=21.8",
    "discord.py[voice]>=2.4.0",
    "aiosmtplib>=3.0.2",
    "aioimaplib>=1.0.1",
    "apscheduler>=3.10.4",
    "qrcode>=7.4.2",

    # Browser Automation
    "playwright>=1.49.0",
    "beautifulsoup4>=4.12.3",

    # Documents & Media
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "pdfplumber>=0.11.4",
    "reportlab>=4.2.0",
    "youtube-transcript-api>=1.2.4",

    # Voice & Audio
    "edge-tts>=7.0.0",
    "sounddevice>=0.5.1",
    "soundfile>=0.14.0",
    "numpy>=2.1.0",
    "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
stealth-browser = ["patchright>=1.49.0", "browser-use>=0.6.0"]
sandboxing = ["docker>=7.1.0", "e2b-code-interpreter>=1.0.0", "daytona>=0.155.0", "paramiko>=3.5.0"]
local-stt = ["faster-whisper>=1.1.0"]
slack = ["slack-bolt>=1.21.0", "slack-sdk>=3.44.1"]
mcp = ["mcp>=2.0.0", "httpx2>=2.7.0", "starlette>=1.3.1"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest", "ruff", "mypy"]
